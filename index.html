<style>

 #lock{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}
 .lockcard{background:#241d26;border:1px solid #3a3040;border-radius:18px;padding:30px 26px;max-width:320px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}

 .lockcard input{width:100%;text-align:center;font-size:1.5rem;letter-spacing:.4em;padding:12px;border-radius:12px;border:2px solid #3a3040;background:#171319;color:#fff;box-sizing:border-box}
 .lockcard button{width:100%;margin-top:12px;padding:13px;border:none;border-radius:12px;background:#b5325f;color:#fff;font-weight:800;font-size:1rem}
 .lockerr{color:#f4756d;font-size:.82rem;min-height:18px;margin-top:8px;font-weight:600}
 #app{min-height:100vh}
</style>
</head>

 document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")tryPw(this.value);});
